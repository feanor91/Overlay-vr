name: build-windows
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publier (ex. 0.0.1) ; vide = simple compilation"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/Release/XR_APILAYER_OVERLAYVR_zones.dll, build/Release/XR_APILAYER_OVERLAYVR_zones.json, build/Release/install_layer.bat, build/Release/uninstall_layer.bat, build/Release/OverlayVR_Tray.exe, build/Release/OverlayVR_Config.exe, build/Release/OverlayVR_Editor.exe, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath OverlayVR-windows.zip
      - name: Installer (NSIS)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $v = 'dev'
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          elseif ('${{ inputs.version }}' -ne '') { $v = '${{ inputs.version }}' }
          $mk = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $mk) {
            $mk = @("C:\Program Files (x86)\NSIS\makensis.exe", "C:\Program Files\NSIS\makensis.exe") |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $mk) { throw "makensis introuvable apres l'installation de NSIS" }
          & $mk "/DVERSION=$v" installer/setup.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis a echoue" }
      - uses: actions/upload-artifact@v4
        with:
          name: OverlayVR-windows
          path: |
            dist/
            OverlayVR-Setup-*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: OverlayVR ${{ inputs.version != '' && inputs.version || github.ref_name }}
          files: |
            OverlayVR-windows.zip
            OverlayVR-Setup-*.exe
          generate_release_notes: true
          prerelease: true
          body: |
            OverlayVR ${{ inputs.version != '' && inputs.version || github.ref_name }} (version de test, non validee sur tous les materiels).
            Telecharge OverlayVR-Setup-*.exe, ferme MSFS avant de l'installer. Voir le README pour les commandes et les reglages.
